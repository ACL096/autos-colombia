spring.application.name=AutosColombia

# Configuracion de la base de datos H2 en un archivo local
spring.datasource.url=jdbc:h2:file:./data/autoscolombia
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web para consultar la base de datos
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
